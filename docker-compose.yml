services:
  neo4j:
    image: neo4j:5.18
    container_name: jarvis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j/data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: jarvis-chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENT_DIRECTORY=/data
    volumes:
      - ./chromadb:/data
